name: ERP auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Release pruefen
        shell: pwsh
        run: ./tools/release-check.ps1 -Strict
      - name: Inventar pruefen
        run: node test/inventory-edit-photo-check.js
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Statische Website vorbereiten
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
