name: ERP auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Release pruefen
        shell: pwsh
        run: ./tools/release-check.ps1 -Strict
      - name: Test-zu-Live-Promotion pruefen
        shell: pwsh
        run: ./tools/promote-test-to-live.ps1 -VerifyOnly
      - name: Fachliche Pruefungen
        run: |
          node test/home-appearance-check.js
          node test/inventory-edit-photo-check.js
          node test/inventory-schema.test.js
          node test/inventory-ui-check.js
          node test/payment-validation-check.js
          node test/statistics-check.js
          node test/bookkeeping-monthly-check.js
          node tools/check-compact-document-lists.js
          node tools/check-document-tabs.js
          node tools/check-file-storage-security.js
          node tools/check-pdf-storage-recovery.js
          node tools/check-qr-layout.js
          node tools/live-inventory-promotion-check.js
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Statische Website vorbereiten
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
